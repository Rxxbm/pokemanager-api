services:
  # Serviço 1: A Nossa Manager API (Node.js + TS)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemanager_api
    restart: unless-stopped
    # Aplica as migrations do Prisma antes de subir o servidor
    command: sh -c "npx prisma migrate deploy && node dist/src/main/server.js"
    ports:
      - '${PORT:-3333}:3333'
    environment:
      PORT: 3333
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokemanager_network

  # Serviço 2: Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: pokemanager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pokemanager_network

  # Serviço 3: Interface de Gerenciamento pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pokemanager_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pokemanager_network

# Declarando a persistência de dados para o Banco e pgAdmin
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pokemanager_network:
    driver: bridge
